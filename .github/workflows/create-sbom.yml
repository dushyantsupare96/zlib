name: Generate SBOM and Legal Notices

on: push

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Optional: build zlib so Syft can also see compiled artifacts
      - name: Build zlib
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j"$(nproc)"

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
        # Syft generates multi-language SBOMs and can output CycloneDX JSON directly. [web:41][web:21]

      - name: Generate CycloneDX SBOM (JSON)
        run: |
          # Scan the repo but ignore VCS and workflows to reduce noise
          syft dir:. \
            --exclude .git \
            --exclude .github \
            -o cyclonedx-json=sbom.json
        # CycloneDX 1.x JSON output is supported via the cyclonedx-json format. [web:35][web:43]

      - name: Generate LEGAL_NOTICES.txt from SBOM
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

          {
            echo "LEGAL NOTICES"
            echo "=============="
            echo
            echo "This file lists third-party components detected in this build and their licenses."
            echo "Source: sbom.json (CycloneDX)"
            echo

            # 1) List all library components (third-party things)
            jq -r '
              .components[]?
              | select(.type == "library")
              | "\(.name // "UNKNOWN") \(.version // "UNKNOWN") - UNKNOWN LICENSE"
            ' sbom.json

            # 2) Explicitly document the main project (zlib) with correct SPDX license
            #    (Syft does not reliably infer this for C/zlib from source alone.)
            echo "zlib UNKNOWN - Zlib"
          } \
          | sort -u \
          > LEGAL_NOTICES.txt
        # CycloneDX supports license declarations, but your current SBOM has none,
        # so licenses must be added or mapped externally like this. [file:56][web:46]

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: SBOM-JSON
          path: sbom.json

      - name: Upload Legal Notices artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEGAL-NOTICES
          path: LEGAL_NOTICES.txt
