name: Generate SBOM and Legal Notices

on: push

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Optional build (kept, but you can remove if not needed)
      - name: Build zlib
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j"$(nproc)"

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
        # Syft supports CycloneDX JSON output for directory scans. [web:41][web:35]

      - name: Generate CycloneDX SBOM (JSON)
        run: |
          # Valid exclude patterns for directory scans must start with ./, */, or **/
          syft dir:. \
            --exclude='./.git/**' \
            --exclude='./.github/**' \
            -o cyclonedx-json=sbom.json
        # For directory sources, exclude globs must be relative like './.git/**'. [web:57][web:61]

      - name: Generate LEGAL_NOTICES.txt from SBOM
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

          {
            echo "LEGAL NOTICES"
            echo "=============="
            echo
            echo "This file lists third-party components detected in this build and their licenses."
            echo "Source: sbom.json (CycloneDX)"
            echo

            # 1) List all library components from the SBOM, even if no license field exists
            jq -r '
              .components[]?
              | select(.type == "library")
              | "\(.name // "UNKNOWN") \(.version // "UNKNOWN") - UNKNOWN LICENSE"
            ' sbom.json

            # 2) Explicit entry for the main project (zlib) with its SPDX license
            echo "zlib UNKNOWN - Zlib"
          } \
          | sort -u \
          > LEGAL_NOTICES.txt
        # CycloneDX has a licenses field, but Syft directory scans often lack it for C code,
        # so licenses are added explicitly here. [file:56][web:46]

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: SBOM-JSON
          path: sbom.json

      - name: Upload Legal Notices artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEGAL-NOTICES
          path: LEGAL_NOTICES.txt
